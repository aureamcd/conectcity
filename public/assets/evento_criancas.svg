  <text x="150" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#fde047">MUNDO BITA &amp; ATRAÇÕES</text>
  <text x="150" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#ffffff">10 DE OUTUBRO • IPUEIRAS</text>
</svg>
