<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="300" height="320">
  <rect width="300" height="320" rx="14" fill="#fffbeb"/>
  <!-- Clouds and Sun -->
  <circle cx="50" cy="45" r="24" fill="#fbbf24"/>
  <circle cx="240" cy="45" r="22" fill="#bae6fd"/>
  <circle cx="260" cy="50" r="18" fill="#bae6fd"/>
  <!-- Title -->
  <text x="150" y="55" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="24" fill="#2563eb">PICOS</text>
  <text x="150" y="83" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="26" fill="#ec4899">CIDADE</text>
  <text x="150" y="112" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="28" fill="#f59e0b">KIDS</text>
  <!-- Mundo Bita / Characters illustration -->
  <circle cx="150" cy="175" r="38" fill="#fde68a" stroke="#d97706" stroke-width="3"/>
