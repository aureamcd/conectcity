  </defs>
  <rect width="300" height="320" rx="14" fill="url(#bgGeek)"/>
  <!-- Neon Grid effect -->
  <circle cx="150" cy="95" r="70" fill="#a855f7" opacity="0.25"/>
  <text x="150" y="68" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="44" fill="#facc15" stroke="#ec4899" stroke-width="2">PGS</text>
