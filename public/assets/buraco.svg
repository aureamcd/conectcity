<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F6FF"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="mud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <!-- Sky & Background houses -->
  <rect width="320" height="80" fill="url(#sky)"/>
  <rect x="10" y="35" width="55" height="45" fill="#fcd34d" rx="2"/>
  <polygon points="5,35 37,15 70,35" fill="#b45309"/>
  <rect x="240" y="30" width="70" height="50" fill="#e5e7eb" rx="2"/>
  <polygon points="235,30 275,12 315,30" fill="#991b1b"/>
  <!-- Trees -->
  <circle cx="110" cy="55" r="22" fill="#15803d"/>
  <circle cx="130" cy="60" r="18" fill="#166534"/>
  <circle cx="205" cy="58" r="20" fill="#15803d"/>
  <!-- Road / Street -->
  <polygon points="0,80 320,80 320,220 0,220" fill="url(#asphalt)"/>
  <rect x="0" y="76" width="320" height="8" fill="#d97706"/>
  <!-- White Car on top left -->
  <rect x="12" y="65" width="58" height="24" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="22" y="56" width="35" height="14" rx="4" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <circle cx="25" cy="90" r="7" fill="#111827"/>
  <circle cx="56" cy="90" r="7" fill="#111827"/>
  <!-- Large Pothole / Crater (Buraco na Ipueiras) -->
  <path d="M 35,130 Q 85,102 165,112 Q 255,115 285,148 Q 295,185 235,204 Q 150,215 75,198 Q 18,175 35,130 Z" fill="#451a03" stroke="#d97706" stroke-width="4"/>
  <path d="M 48,138 Q 95,115 165,122 Q 245,125 270,152 Q 275,180 225,195 Q 150,204 85,190 Q 32,172 48,138 Z" fill="url(#mud)"/>
  <!-- Puddle water inside pothole -->
  <ellipse cx="160" cy="162" rx="78" ry="24" fill="#d97706" opacity="0.65"/>
  <ellipse cx="155" cy="164" rx="55" ry="15" fill="#78350f" opacity="0.5"/>
  <!-- Warning sign -->
  <polygon points="275,70 295,105 255,105" fill="#f59e0b" stroke="#111827" stroke-width="2"/>
  <text x="275" y="101" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="18" fill="#111827">!</text>
</svg>
